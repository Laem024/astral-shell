[ids]
*

[main]
leftshift = layer(lshift)
rightshift = layer(rshift)
# Hyprland starts with Num Lock on. Toggle the layer and send Num Lock to XKB.
numlock = togglem(numpadnav, numlock)

[lshift:S]
kp1 = end
kp2 = down
kp3 = pagedown
kp4 = left
kp6 = right
kp7 = home
kp8 = up
kp9 = pageup

[rshift:S]
kp1 = end
kp2 = down
kp3 = pagedown
kp4 = left
kp6 = right
kp7 = home
kp8 = up
kp9 = pageup

[numpadnav]

[lshift+rshift]
kp1 = S-end
kp2 = S-down
kp3 = S-pagedown
kp4 = S-left
kp6 = S-right
kp7 = S-home
kp8 = S-up
kp9 = S-pageup

[numpadnav+lshift]
kp1 = S-end
kp2 = S-down
kp3 = S-pagedown
kp4 = S-left
kp6 = S-right
kp7 = S-home
kp8 = S-up
kp9 = S-pageup

[numpadnav+rshift]
kp1 = S-end
kp2 = S-down
kp3 = S-pagedown
kp4 = S-left
kp6 = S-right
kp7 = S-home
kp8 = S-up
kp9 = S-pageup
