# Light variant of hyprtoolkit.conf, using the light palette from docs/design-system.md.
# To use it, copy this file over hyprtoolkit.conf.
background         = 0xFFEEF2EF
base               = 0xFFFBFCFA
text               = 0xFF141B1D
alternate_base     = 0xFFFBFCFA
bright_text        = 0xFF141B1D
link_text          = 0xFF3B4A7A
accent             = 0xFF17675A
accent_secondary   = 0xFF3B4A7A

rounding_large = 16
rounding_small = 8

font_family           = Adwaita Sans
font_family_monospace = JetBrainsMono Nerd Font
icon_theme            = Papirus-Dark

h1_size         = 24
h2_size         = 18
h3_size         = 15
font_size       = 14
small_font_size = 11
