# Shared theme for Hyprtoolkit applications, using the dark Astral palette from docs/design-system.md.
# For light mode, copy hyprtoolkit-light.conf over this file.
background         = 0xFF0E1113
base               = 0xFF171C1F
text               = 0xFFE7ECE9
alternate_base     = 0xFF171C1F
bright_text        = 0xFFE7ECE9
link_text          = 0xFFA9B5D9
accent             = 0xFF7FD0BF
accent_secondary   = 0xFFA9B5D9

rounding_large = 16
rounding_small = 8

font_family           = Adwaita Sans
font_family_monospace = JetBrainsMono Nerd Font
icon_theme            = Papirus-Dark

h1_size         = 24
h2_size         = 18
h3_size         = 15
font_size       = 14
small_font_size = 11
