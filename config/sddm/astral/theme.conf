; Astral SDDM theme settings.
; Edit this file with sudo, then the change appears the next time SDDM starts.
; mode accepts dark (default) or light.
; background accepts a preset (aurora, nebula, dusk, void), a path relative to
; the theme directory, or an absolute path readable by the sddm user.

[General]
mode=dark
background=aurora
backgroundMode=fill
backgroundDrift=true
animations=true
stars=true
starDensity=1.0
shootingStars=true
meteorCount=2
meteorAngle=28
scale=1.0
clockFormat=24h
activationMode=click
inactiveDim=0.45
showAvatar=true
showSession=true
showPower=true
showHostname=true
showKeyboard=true
avatar=
