; Astral SDDM theme settings.
; Edit this file with sudo, then the change appears the next time SDDM starts.
; background accepts a preset (aurora, nebula, dusk, void), a path relative to
; the theme directory, or an absolute path readable by the sddm user.

[General]
background=aurora
backgroundMode=fill
backgroundDrift=true
overlay=0.24
glassOpacity=0.52
animations=true
stars=true
starDensity=1.0
shootingStars=true
meteorCount=2
meteorAngle=28
scale=1.0
clockFormat=24h
activationMode=click
inactiveDim=0.45
showAvatar=true
showSession=true
showPower=true
showHostname=true
showKeyboard=true
avatar=
accentColor=#B1D7CB
lavenderColor=#C6CCD2
goldColor=#E4B882
textColor=#F4EEDF
mutedColor=#B1B5AD
surfaceColor=#202629
backgroundColor=#151918
alertColor=#FF957C
